ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

interface=wlan1
driver=nl80211
ssid=Aespo_EHT

hw_mode=a
channel=36
country_code=US

beacon_int=100
dtim_period=2

wmm_enabled=1

ieee80211d=1

# --- AX / Wi-Fi 6 設定 ---
ieee80211n=1
ieee80211ac=1
ieee80211ax=1
ieee80211be=1


vht_oper_chwidth=0

he_oper_chwidth=0
#he_oper_centr_freq_seg0_idx=42
he_bss_color=37
eht_oper_chwidth=0
#eht_oper_centr_freq_seg0_idx=79

mld_ap=1
# --- SAE H2E 關鍵參數 ---
# sae_pwe=2 代表只允許 H2E 模式 (強制 Wi-Fi 6 安全標準)
sae_pwe=2

# --- 安全與密碼 ---
wpa=2
wpa_key_mgmt=SAE-EXT-KEY
rsn_pairwise=GCMP-256
ieee80211w=2
sae_password=password123|id=test_id_1
